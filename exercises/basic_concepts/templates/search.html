<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Búsqueda</title>
</head>
<body>
  <h1>Buscar usuario o grupo</h1>
  <form method="post" action="/search">
    <input type="text" name="q" placeholder="Nombre o ID" required>
    <select name="type">
      <option value="user">Usuario</option>
      <option value="group">Grupo</option>
    </select>
    <button type="submit">Buscar</button>
  </form>
  {% if message %}<p style="color:orange">{{ message }}</p>{% endif %}
</body>
</html>

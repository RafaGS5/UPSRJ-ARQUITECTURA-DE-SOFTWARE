<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Búsqueda</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 0;
            color: #333;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        main {
            max-width: 600px;
            margin: 3rem auto;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #2c3e50;
        }

        label {
            display: block;
            margin-top: 1rem;
            font-weight: 600;
        }

        select, input[type="text"], button {
            width: 100%;
            padding: 0.8rem;
            margin-top: 0.5rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        select:focus, input:focus {
            border-color: #2980b9;
            outline: none;
        }

        button {
            background-color: #2980b9;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 1.5rem;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #1f6391;
        }
    </style>
</head>
<body>
    <header>
        <h2>Sistema de Búsqueda</h2>
    </header>

    <main>
        <h1>Búsqueda de Usuarios y Grupos</h1>

        <form method="GET" action="/search">
            <!-- Selección del tipo de entidad -->
            <label for="entity_type">Buscar en:</label>
            <select id="entity_type" name="type">
                <option value="user" selected>Usuarios</option>
                <option value="group">Grupos</option>
            </select>

            <!-- Selección del modo -->
            <label for="search_mode">Modo de búsqueda:</label>
            <select id="search_mode" name="mode">
                <option value="keyword" selected>Por palabra clave</option>
                <option value="id">Por ID</option>
            </select>

            <!-- Campo de búsqueda -->
            <label for="input_search">Término de búsqueda:</label>
            <input type="text" id="input_search" name="q" placeholder="Ingrese búsqueda" required>

            <button type="submit">Buscar</button>
        </form>
    </main>
</body>
</html>
